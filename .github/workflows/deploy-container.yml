# Continuous deployment for load-balanced hosting: builds the container image and pushes it to GHCR.
# Your platform (VM, Kubernetes, ECS, Cloud Run, etc.) pulls the image behind its load balancer.
# Requires a repository variable SITE_URL.
name: Build and push container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require production SITE_URL
        run: |
          if [ -z "${SITE_URL}" ]; then
            echo "Set the SITE_URL repository variable first." >&2
            exit 1
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
