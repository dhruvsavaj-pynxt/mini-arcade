# Load-balanced deployment: two app containers behind an nginx load balancer.
# Run from the deploy/ folder:
#   $env:SITE_URL = "https://dhruvsavaj-pynxt.github.io/mini-arcade"; docker compose up -d --build
# Then open http://localhost (the load balancer). Scale by adding app3 etc. to lb.conf.
services:
  app1:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL to your public address}
    image: mini-arcade:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  app2:
    image: mini-arcade:local
    depends_on:
      - app1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
