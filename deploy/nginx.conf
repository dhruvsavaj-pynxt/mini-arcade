# Per-container web server. Listens on 8080 and serves the generated site.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Compression for text assets.
  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Cache policy: HTML revalidates, JS/CSS cache for a week.
  map $uri $cache_control {
    ~*\.(css|js)$  "public, max-age=604800";
    ~*\.html$      "no-cache";
    default        "public, max-age=3600";
  }
  add_header Cache-Control $cache_control always;

  # Security headers. style-src allows inline style attributes used for per-game accent colors.
  # When an ad network is added, extend script-src / img-src / frame-src for it here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Health endpoint used by the container HEALTHCHECK and the load balancer.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
