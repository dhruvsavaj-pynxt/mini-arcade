# Load balancer: spreads traffic across the app containers in docker-compose.yml.
# TLS: terminate HTTPS here (listen 443 ssl + certificates) or at your cloud load balancer / CDN.
upstream mini_arcade {
  least_conn;
  server app1:8080 max_fails=3 fail_timeout=10s;
  server app2:8080 max_fails=3 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 1m;

  # The balancer's own health endpoint (does not hit the app containers).
  location = /lb-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://mini_arcade;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Retry the other container when one fails, so a single bad instance is invisible to users.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
